name: Book · build and PDF

on:
  push:
    branches: [main]
    paths-ignore: ['public/downloads/**', 'docs/**', 'README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and check content
        run: npm run build
      - name: Install Chromium for PDF export
        run: npx playwright install --with-deps chromium
      - name: Export and verify PDF
        run: |
          npm run pdf
          npm run verify:pdf
      - name: Include the generated PDF in the website
        run: npm run build
      - name: Preserve ebook, site and validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahos-cbam-ebook
          path: |
            public/downloads/*.pdf
            dist/
            output/*.json
          retention-days: 90
          if-no-files-found: warn
