name: Preserve approved CBAM PDF

on:
  push:
    branches: [assets/cbam-approved-2026-10-12]
    paths: ['.github/workflows/preserve-approved-pdf.yml']

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve the exact artifact approved by the author
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38261798243 --repo ahosesg/ahosebooks --name cbam-review-exportador --dir /tmp/cbam-approved-artifact
      - name: Verify and preserve the approved bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          filename = 'minha-empresa-esta-no-cbam-revisao-2026-10-12.pdf'
          source = Path('/tmp/cbam-approved-artifact/public/downloads') / filename
          expected = '209a128f3ffa9a6d884da88bfc821b0e2d733f703ac4f223885151e2b433e4a7'
          data = source.read_bytes()
          assert len(data) == 1229538, 'Unexpected approved PDF size'
          assert hashlib.sha256(data).hexdigest() == expected, 'Approved PDF hash mismatch'
          assert data.startswith(b'%PDF-'), 'Invalid PDF signature'
          target = Path('public/downloads') / filename
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)
          print('Approved 16-page PDF preserved without recompilation.')
          PY
      - name: Commit the approved PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/downloads/minha-empresa-esta-no-cbam-revisao-2026-10-12.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: preserve author-approved CBAM PDF of 2026-10-12"
          git push origin "HEAD:${GITHUB_REF_NAME}"
