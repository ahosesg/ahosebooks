name: Ebook review · language for exporters

on:
  push:
    branches: [review/cbam-linguagem-exportador]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run build
      - name: Compile and verify the review PDF
        env:
          EBOOK_CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run pdf
          npm run verify:pdf
      - name: Preserve PDF and page review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbam-review-exportador
          path: |
            public/downloads/*revisao*.pdf
            output/*.json
            output/review-*/
          retention-days: 90
